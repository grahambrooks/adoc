[package]
name = "adoc"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/grahambrooks/adoc"
description = "Rust command-line processor for the AsciiDoc Language specification"

[dependencies]
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
camino = { version = "1", features = ["serde1"] }
unicode-segmentation = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = "0.8"
sha2 = "0.10"

[dev-dependencies]
insta = { version = "1", features = ["json"] }

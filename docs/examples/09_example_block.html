<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Untitled</title>
<style>
/* adoc.css — default stylesheet for HTML5 output from the adoc processor.
 *
 * Theming uses CSS custom properties resolved with `light-dark()` gated on
 * `color-scheme: light dark`. Browsers honour `prefers-color-scheme` out of
 * the box; explicit override via `<html data-theme="light|dark">`.
 *
 * The custom-property names below are the public interface — user
 * stylesheets can re-declare any of them to retheme the output without
 * touching the structural rules.
 */

:root {
  color-scheme: light dark;

  /* --- Surfaces & ink ----------------------------------------------- */
  --adoc-bg:              light-dark(#ffffff, #0d1117);
  --adoc-bg-soft:         light-dark(#fafbfc, #11161d);
  --adoc-fg:              light-dark(#1f2328, #e6edf3);
  --adoc-muted:           light-dark(#57606a, #8b949e);
  --adoc-faint:           light-dark(#8c959f, #6e7681);

  /* --- Accents ------------------------------------------------------ */
  --adoc-accent:          light-dark(#0969da, #4493f8);
  --adoc-accent-hover:    light-dark(#0860c7, #79b8ff);
  --adoc-accent-soft:     color-mix(in oklab, var(--adoc-accent) 12%, transparent);

  /* --- Lines & dividers --------------------------------------------- */
  --adoc-border:          light-dark(#d8dee4, #30363d);
  --adoc-border-soft:     light-dark(#eaeef2, #21262d);

  /* --- Code & blocks ------------------------------------------------ */
  --adoc-code-bg:         light-dark(#f6f8fa, #161b22);
  --adoc-code-fg:         light-dark(#1f2328, #e6edf3);
  --adoc-example-bg:      light-dark(#f6f8fa, #161b22);

  /* --- Sidebar / aside (neutral, not yellow) ------------------------ */
  --adoc-aside-bg:        light-dark(#f6f8fa, #161b22);
  --adoc-aside-border:    light-dark(#d8dee4, #30363d);

  /* --- Quote -------------------------------------------------------- */
  --adoc-quote-border:    light-dark(#d8dee4, #30363d);
  --adoc-quote-fg:        light-dark(#57606a, #8b949e);

  /* --- Tables ------------------------------------------------------- */
  --adoc-table-border:    light-dark(#e1e4e8, #30363d);
  --adoc-table-header-bg: light-dark(#f6f8fa, #161b22);
  --adoc-table-row-alt:   light-dark(#fafbfc, #11161d);

  /* --- Selection / focus ------------------------------------------- */
  --adoc-selection:       color-mix(in oklab, var(--adoc-accent) 28%, transparent);
  --adoc-focus-ring:      var(--adoc-accent);

  /* --- Admonition accents (left-rule + tinted bg) ------------------ */
  --adoc-note:            light-dark(#0969da, #58a6ff);
  --adoc-tip:             light-dark(#1a7f37, #3fb950);
  --adoc-important:       light-dark(#9a6700, #d29922);
  --adoc-warning:         light-dark(#bc4c00, #db6d28);
  --adoc-caution:         light-dark(#cf222e, #f85149);

  /* --- Shadows ------------------------------------------------------ */
  --adoc-shadow-sm: 0 1px 2px light-dark(rgb(31 35 40 / 0.06), rgb(0 0 0 / 0.4));
  --adoc-shadow-md: 0 1px 3px light-dark(rgb(31 35 40 / 0.06), rgb(0 0 0 / 0.4)),
                    0 4px 12px light-dark(rgb(31 35 40 / 0.04), rgb(0 0 0 / 0.3));

  /* --- Type --------------------------------------------------------- */
  --adoc-font-body:
    "Inter Variable", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
    Roboto, Helvetica, Arial, sans-serif,
    "Apple Color Emoji", "Segoe UI Emoji";
  --adoc-font-mono:
    ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
    "Liberation Mono", monospace;

  /* --- Layout ------------------------------------------------------- */
  --adoc-content-width: 48rem;
  --adoc-radius:        8px;
  --adoc-radius-sm:     4px;
}

[data-theme="light"] { color-scheme: light; }
[data-theme="dark"]  { color-scheme: dark;  }

/* ---------------------------------------------------------------------
 *  Reset / base
 * ------------------------------------------------------------------ */

*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-behavior: smooth;
  tab-size: 4;
}

::selection { background: var(--adoc-selection); }

:focus-visible {
  outline: 2px solid var(--adoc-focus-ring);
  outline-offset: 2px;
  border-radius: var(--adoc-radius-sm);
}

body {
  margin: 0;
  padding: 3rem 1.25rem 5rem;
  font-family: var(--adoc-font-body);
  font-size: 1rem;
  line-height: 1.65;
  color: var(--adoc-fg);
  background: var(--adoc-bg);
  font-feature-settings: "kern", "liga", "calt";
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body > * {
  max-width: var(--adoc-content-width);
  margin-left: auto;
  margin-right: auto;
}

/* `<main id="content">` wraps the document body so every section, the
   TOC, and any pre-section preamble share the same enclosing context.
   `<div id="preamble">` is a structural-only wrapper; no decoration. */
main#content { display: block; }
#preamble { display: block; }
#preamble > :first-child { margin-top: 0; }

/* Long URLs and inline code shouldn't push the layout. */
p, li, dd, blockquote, .footnote {
  overflow-wrap: anywhere;
  word-break: break-word;
}

/* ---------------------------------------------------------------------
 *  Document header
 * ------------------------------------------------------------------ */

body > header {
  border-bottom: 1px solid var(--adoc-border-soft);
  padding-bottom: 1.5rem;
  margin-bottom: 2.5rem;
}
body > header h1 {
  font-size: clamp(1.875rem, 1.4rem + 1.5vw, 2.5rem);
  line-height: 1.15;
  margin: 0 0 0.5rem;
  letter-spacing: -0.015em;
}
.authors, .revision {
  color: var(--adoc-muted);
  margin: 0.25rem 0;
  font-size: 0.95rem;
}

/* ---------------------------------------------------------------------
 *  Headings
 * ------------------------------------------------------------------ */

h1, h2, h3, h4, h5, h6 {
  line-height: 1.25;
  margin-top: 2.25em;
  margin-bottom: 0.6em;
  font-weight: 600;
  letter-spacing: -0.01em;
  text-wrap: balance;
  scroll-margin-top: 4rem;
}
h1 { font-size: 2rem; letter-spacing: -0.02em; }
h2 {
  font-size: 1.5rem;
  border-bottom: 1px solid var(--adoc-border-soft);
  padding-bottom: 0.35em;
}
h3 { font-size: 1.25rem; }
h4 { font-size: 1.05rem; }
h5 { font-size: 1rem; }
h6 { font-size: 0.9rem; color: var(--adoc-muted); text-transform: uppercase; letter-spacing: 0.04em; }

/* Sections inherit content width from body > *; nested sections flow inline. */
section > :is(h1, h2, h3, h4, h5, h6):first-child { margin-top: 1.5em; }

/* `[discrete]` headings — same visual rhythm but no underline (the
   underline implies a section bound, which a discrete heading doesn't open). */
:is(h1, h2, h3, h4, h5, h6).discrete { border-bottom: 0; padding-bottom: 0; }

/* ---------------------------------------------------------------------
 *  Paragraphs & inline
 * ------------------------------------------------------------------ */

p {
  margin: 0 0 1em;
  /* Progressive enhancement: keeps line-end orphans tidy in modern browsers. */
  text-wrap: pretty;
}

a {
  color: var(--adoc-accent);
  text-decoration: underline;
  text-underline-offset: 0.18em;
  text-decoration-thickness: 0.06em;
  transition: color 120ms ease, text-decoration-thickness 120ms ease;
}
a:hover {
  color: var(--adoc-accent-hover);
  text-decoration-thickness: 0.12em;
}

strong { font-weight: 650; }
em     { font-style: italic; }
small  { font-size: 0.875em; }

/* ---------------------------------------------------------------------
 *  Lists
 * ------------------------------------------------------------------ */

ul, ol { padding-left: 1.5em; margin: 0 0 1em; }
li     { margin: 0.25em 0; }
li > :is(ul, ol) { margin: 0.3em 0 0; }
li::marker { color: var(--adoc-faint); }

dl { margin: 0 0 1em; }
dt { font-weight: 600; margin-top: 0.85em; }
dd { margin: 0.25em 0 0 1.5em; }
dd > p:first-child { margin-top: 0; }

/* ---------------------------------------------------------------------
 *  Code (inline + blocks)
 * ------------------------------------------------------------------ */

code, kbd, samp, var {
  font-family: var(--adoc-font-mono);
  font-feature-settings: "calt" 0, "liga" 0;  /* keep ligatures off in code */
}

code {
  /* Match surrounding text: same em size as the prose, so a `code`
     span inside a paragraph doesn't shrink relative to the line. */
  font-size: 1em;
  background: var(--adoc-code-bg);
  color: var(--adoc-code-fg);
  padding: 0.15em 0.4em;
  border-radius: var(--adoc-radius-sm);
  white-space: nowrap;
}

kbd {
  display: inline-block;
  padding: 0.1em 0.45em;
  font-size: 1em;
  border: 1px solid var(--adoc-border);
  border-bottom-width: 2px;
  border-radius: var(--adoc-radius-sm);
  background: var(--adoc-bg-soft);
  color: var(--adoc-fg);
  vertical-align: 0.05em;
}

/* UI macros: kbd:[…], btn:[…], menu:Path[Steps]. */
.keyseq { white-space: nowrap; }
.keyseq kbd + kbd { margin-left: 0; }
b.button {
  font-family: var(--adoc-font-mono);
  font-weight: 600;
  font-size: 1em;
}
.menuseq {
  font-family: var(--adoc-font-body);
}
.menu, .menuitem {
  font-weight: 600;
  color: var(--adoc-fg);
}

pre {
  font-family: var(--adoc-font-mono);
  /* Match surrounding text size so a code block reads at the same
     scale as the prose around it — easier to scan, no eye-jump
     between paragraph and listing. */
  font-size: 1em;
  background: var(--adoc-code-bg);
  color: var(--adoc-code-fg);
  padding: 1em 1.25em;
  border: 1px solid var(--adoc-border-soft);
  border-radius: var(--adoc-radius);
  overflow-x: auto;
  line-height: 1.55;
  margin: 0 0 1.25em;
  box-shadow: var(--adoc-shadow-sm);
  position: relative;
}
pre code {
  background: transparent;
  padding: 0;
  border-radius: 0;
  font-size: 1em;
  white-space: inherit;
}

/* Source-block language label as a corner pill. Uses a content-style chip
 * (not flow text) so it doesn't fight any client-side highlighter that
 * decorates the same `<code>`. */
pre:has(> code[class^="language-"])::before {
  content: attr(data-lang);
  position: absolute;
  top: 0.6em;
  right: 0.85em;
  font-size: 0.7em;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--adoc-muted);
  user-select: none;
  pointer-events: none;
}

/* ---------------------------------------------------------------------
 *  Block quote
 * ------------------------------------------------------------------ */

blockquote {
  border-left: 0.25em solid var(--adoc-quote-border);
  margin: 0 0 1.25em;
  padding: 0.25em 1.25em;
  color: var(--adoc-quote-fg);
  font-style: italic;
}
blockquote > :first-child { margin-top: 0; }
blockquote > :last-child  { margin-bottom: 0; }
blockquote em { font-style: normal; }

/* `[verse]` quote — preserve line breaks, drop the prose typography. */
.verseblock {
  font-family: var(--adoc-font-body);
  font-size: 1em;
  line-height: 1.5;
  background: transparent;
  border: 0;
  border-left: 0.25em solid var(--adoc-quote-border);
  border-radius: 0;
  box-shadow: none;
  padding: 0.5em 1.25em;
  margin: 0 0 0.5em;
  color: var(--adoc-quote-fg);
  font-style: italic;
  white-space: pre;
}

/* Attribution line under blockquotes and verse blocks. */
.attribution {
  margin: 0.25em 0 1.25em 0.25em;
  padding-left: 1em;
  font-size: 0.9em;
  color: var(--adoc-muted);
  font-style: normal;
}
.attribution cite { font-style: italic; }

/* ---------------------------------------------------------------------
 *  Containing blocks: example, sidebar, open
 * ------------------------------------------------------------------ */

.example {
  background: var(--adoc-example-bg);
  border: 1px solid var(--adoc-border-soft);
  border-radius: var(--adoc-radius);
  padding: 1em 1.25em;
  margin: 0 0 1.25em;
  box-shadow: var(--adoc-shadow-sm);
}
.example > :first-child { margin-top: 0; }
.example > :last-child  { margin-bottom: 0; }

aside {
  background: var(--adoc-aside-bg);
  border: 1px solid var(--adoc-aside-border);
  border-left: 4px solid var(--adoc-accent);
  border-radius: var(--adoc-radius);
  padding: 1em 1.25em;
  margin: 0 0 1.25em;
  box-shadow: var(--adoc-shadow-sm);
}
aside > :first-child { margin-top: 0; }
aside > :last-child  { margin-bottom: 0; }

/* Block titles (`.Title` lines). */
.title {
  font-weight: 600;
  color: var(--adoc-fg);
  margin: 1.25em 0 0.4em;
  font-size: 0.95em;
}

/* ---------------------------------------------------------------------
 *  Tables
 * ------------------------------------------------------------------ */

table {
  border-collapse: collapse;
  width: 100%;
  margin: 0 0 1.25em;
  border: 1px solid var(--adoc-table-border);
  border-radius: var(--adoc-radius);
  overflow: hidden;
  font-variant-numeric: tabular-nums;
}
th, td {
  padding: 0.6em 0.85em;
  border-bottom: 1px solid var(--adoc-table-border);
  text-align: left;
  vertical-align: top;
}
tbody tr:last-child > * { border-bottom: 0; }
th {
  background: var(--adoc-table-header-bg);
  font-weight: 600;
  font-size: 0.92em;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--adoc-muted);
  border-bottom: 1px solid var(--adoc-table-border);
}
tbody tr:nth-child(even) > td { background: var(--adoc-table-row-alt); }

/* Literal cells preserve whitespace and use the same code background as
   inline <code>. */
td > pre, th > pre {
  margin: 0;
  background: transparent;
  padding: 0;
  border: 0;
  box-shadow: none;
  /* Match surrounding cell text. */
  font-size: 1em;
}

td.halign-left,   th.halign-left   { text-align: left; }
td.halign-center, th.halign-center { text-align: center; }
td.halign-right,  th.halign-right  { text-align: right; }

/* ---------------------------------------------------------------------
 *  Images & rule
 * ------------------------------------------------------------------ */

img {
  max-width: 100%;
  height: auto;
  border-radius: var(--adoc-radius-sm);
}

/* Block image (`image::path[alt]`) — centred figure with optional caption. */
.imageblock,
.videoblock,
.audioblock {
  margin: 1.5em 0;
  text-align: center;
}
.imageblock > .content > img,
.videoblock > .content > video,
.audioblock > .content > audio { display: inline-block; max-width: 100%; }
.audioblock > .content > audio { width: 100%; }
.imageblock > .title,
.videoblock > .title,
.audioblock > .title {
  margin-top: 0.5em;
  font-size: 0.9em;
  color: var(--adoc-muted);
  font-style: italic;
}

hr {
  border: 0;
  border-top: 1px solid var(--adoc-border);
  margin: 2.5em 0;
}

/* ---------------------------------------------------------------------
 *  Admonitions
 * ------------------------------------------------------------------ */

.admonitionblock {
  --admonition-color: var(--adoc-muted);
  margin: 1.5em 0;
  padding: 1em 1.25em 1em 2.75em;
  position: relative;
  border: 1px solid var(--adoc-border-soft);
  border-left: 4px solid var(--admonition-color);
  border-radius: var(--adoc-radius);
  background: color-mix(in oklab, var(--admonition-color) 6%, var(--adoc-bg));
  box-shadow: var(--adoc-shadow-sm);
}
.admonitionblock > .label,
.admonitionblock > .title {
  margin: 0 0 0.4em;
  font-weight: 600;
  font-size: 0.85em;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--admonition-color);
}
.admonitionblock > .content > :first-child { margin-top: 0; }
.admonitionblock > .content > :last-child  { margin-bottom: 0; }
.admonitionblock::before {
  content: "";
  position: absolute;
  left: 0.85em;
  top: 1.05em;
  width: 1.1em;
  height: 1.1em;
  background: var(--admonition-color);
  -webkit-mask: var(--admonition-icon) center / contain no-repeat;
          mask: var(--admonition-icon) center / contain no-repeat;
}
.admonitionblock.note      { --admonition-color: var(--adoc-note);
  --admonition-icon: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='black' d='M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Zm0 4.25a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 5.75Zm0 6.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z'/></svg>");
}
.admonitionblock.tip       { --admonition-color: var(--adoc-tip);
  --admonition-icon: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='black' d='M8 1a5 5 0 0 0-3 9v1.5a.5.5 0 0 0 .5.5h5a.5.5 0 0 0 .5-.5V10a5 5 0 0 0-3-9Zm-2 13a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3A.5.5 0 0 1 6 14Zm.5 1.5a.5.5 0 0 0 0 1h3a.5.5 0 0 0 0-1h-3Z'/></svg>");
}
.admonitionblock.important { --admonition-color: var(--adoc-important);
  --admonition-icon: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='black' d='M8 .5a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-1 0V1A.5.5 0 0 1 8 .5Zm0 12a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z'/></svg>");
}
.admonitionblock.warning   { --admonition-color: var(--adoc-warning);
  --admonition-icon: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='black' d='M7.13 1.69a1 1 0 0 1 1.74 0l6.51 11.31A1 1 0 0 1 14.51 14.5h-13a1 1 0 0 1-.87-1.5L7.13 1.69ZM8 6a.75.75 0 0 0-.75.75v3.5a.75.75 0 0 0 1.5 0v-3.5A.75.75 0 0 0 8 6Zm0 6.5a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z'/></svg>");
}
.admonitionblock.caution   { --admonition-color: var(--adoc-caution);
  --admonition-icon: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='black' d='M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Zm-1.5 4a.75.75 0 0 1 1.06 0L8 6.94l.44-.44a.75.75 0 0 1 1.06 1.06L9.06 8l.44.44a.75.75 0 1 1-1.06 1.06L8 9.06l-.44.44A.75.75 0 0 1 6.5 8.44L6.94 8l-.44-.44a.75.75 0 0 1 0-1.06Z'/></svg>");
}

/* ---------------------------------------------------------------------
 *  Table of Contents
 * ------------------------------------------------------------------ */

#toc {
  margin: 2em 0 2.5em;
  padding: 1em 1.25em;
  border: 1px solid var(--adoc-border-soft);
  border-radius: var(--adoc-radius);
  background: var(--adoc-bg-soft);
  font-size: 0.95em;
}
#toc .toc-title {
  font-weight: 600;
  margin-bottom: 0.65em;
  color: var(--adoc-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-size: 0.78em;
}
#toc ul {
  list-style: none;
  padding-left: 0;
  margin: 0.25em 0;
}
#toc ul ul { padding-left: 1.25em; border-left: 1px solid var(--adoc-border-soft); margin-left: 0.4em; }
#toc li { margin: 0.2em 0; }
#toc a {
  color: var(--adoc-fg);
  text-decoration: none;
  display: inline-block;
  padding: 0.05em 0;
}
#toc a:hover { color: var(--adoc-accent); text-decoration: underline; }
#toc .sectnum { color: var(--adoc-faint); }

/* ---------------------------------------------------------------------
 *  Section numbers & heading anchors
 * ------------------------------------------------------------------ */

.sectnum {
  color: var(--adoc-faint);
  margin-right: 0.5em;
  font-variant-numeric: tabular-nums;
  font-weight: 500;
}
:is(h1, h2, h3, h4, h5, h6) > .anchor {
  display: inline-block;
  width: 0;
  margin-left: -0.95em;
  padding-right: 0.45em;
  text-decoration: none;
  color: var(--adoc-faint);
  opacity: 0;
  transition: opacity 0.15s ease;
}
:is(h1, h2, h3, h4, h5, h6):hover > .anchor,
:is(h1, h2, h3, h4, h5, h6):focus-within > .anchor { opacity: 1; }
:is(h1, h2, h3, h4, h5, h6) > .anchor::before { content: "#"; }

/* ---------------------------------------------------------------------
 *  Source-block callouts
 * ------------------------------------------------------------------ */

.conum {
  display: inline-block;
  min-width: 1.25em;
  height: 1.25em;
  padding: 0 0.35em;
  font-family: var(--adoc-font-mono);
  font-size: 0.78em;
  font-weight: 700;
  text-align: center;
  line-height: 1.25em;
  color: light-dark(#ffffff, #0d1117);
  background: var(--adoc-accent);
  border-radius: 999px;
  vertical-align: 0.05em;
  user-select: none;
}
ol.colist {
  margin: 0.5em 0 1.25em;
  padding-left: 2em;
  color: var(--adoc-fg);
}
ol.colist > li { margin: 0.3em 0; padding-left: 0.25em; }
ol.colist > li::marker { color: var(--adoc-accent); font-weight: 600; }

/* ---------------------------------------------------------------------
 *  Inline highlight, sub/sup, footnote
 * ------------------------------------------------------------------ */

mark {
  background: light-dark(#fff8c5, #4d3800);
  color: inherit;
  padding: 0 0.2em;
  border-radius: 0.2em;
}
sub, sup { font-size: 0.78em; line-height: 0; }

/* Inline footnote reference (the converter rewrites the parser's
   `<span class="footnote">…</span>` into a numbered `<sup>` ref). */
sup.footnote {
  font-size: 0.78em;
  margin: 0 0.05em;
  line-height: 0;
}
sup.footnote a { text-decoration: none; color: var(--adoc-accent); }
sup.footnote a:hover { text-decoration: underline; }

/* End-of-document footnote section. */
#footnotes {
  margin-top: 3em;
  font-size: 0.9em;
  color: var(--adoc-muted);
}
#footnotes hr {
  margin: 0 0 1em;
  border: 0;
  border-top: 1px solid var(--adoc-border-soft);
}
#footnotes .footnote {
  margin: 0.4em 0;
  padding-left: 1.5em;
  text-indent: -1.5em;
}
#footnotes .footnote a {
  font-weight: 600;
  text-decoration: none;
}
#footnotes .footnote a:hover { text-decoration: underline; }

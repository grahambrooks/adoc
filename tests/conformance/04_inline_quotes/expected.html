<title>Untitled</title>
</head>
<body>
<main id="content">
<div id="preamble">
<p>Constrained: <strong>strong</strong>, <em>emphasis</em>, <code>monospace</code>.</p>
<p>Unconstrained: <strong>bo</strong>ld, <em>it</em>alic, <code>mo</code>no.</p>
<p>Combined: <strong><em>strong em</em></strong>, <strong><code>bold mono</code></strong>, <em><code>italic mono</code></em>.</p>
<p>Specials survive: 1 &lt; 2 &amp;&amp; 3 &gt; 2 stays literal.</p>
</div>
</main>
</body>
</html>
